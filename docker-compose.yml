services:
  postgres:
    image: postgres:18-alpine
    container_name: lazonube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lazonube
      POSTGRES_USER: lazonube
      POSTGRES_PASSWORD: lazonube
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lazonube -d lazonube']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.14.0
    container_name: lazonube-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: 0
      PERSISTENCE: 1
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: lazonube-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  localstack_data:
