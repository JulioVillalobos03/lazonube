name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lazonube_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazonube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_NAME: LazoNube
      APP_ENV: test
      APP_VERSION: ci
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lazonube_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lazonube_test
      NUXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NUXT_PUBLIC_ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check package manager lockfiles
        run: npm run check:lockfiles
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Check Prisma schema formatting
        run: npm run prisma:format:check
      - name: Validate OpenAPI
        run: npm run openapi:check
      - name: Apply migrations
        run: npm run db:migrate:deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Build Nuxt
        run: npm run build
      - name: Build worker
        run: npm run worker:build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
